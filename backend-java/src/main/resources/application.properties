spring.application.name=tarea4-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tarea2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=cc5002
spring.datasource.password=programacionweb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema ya existe (creado por los scripts en backend/sql/schema/) y Hibernate
# nunca lo modifica. Se usa "none" en vez de "validate" porque el validador de Hibernate
# compara el tipo JDBC crudo y reporta como error las columnas ENUM de MySQL (aunque
# sean compatibles en lectura/escritura como String), generando falsos positivos.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

spring.jackson.time-zone=America/Santiago
